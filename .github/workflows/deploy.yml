name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ХАК: Добавляем версию к путям в HTML, чтобы сбросить кэш
      - name: Inject Cache Buster
        run: |
          # Генерируем уникальный хэш на основе времени коммита
          VERSION=$(date +%s)
          
          # Заменяем ссылки в index.html
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$VERSION\"|g" index.html
          sed -i "s|src=\"js/main.js\"|src=\"js/main.js?v=$VERSION\"|g" index.html
          
          # ВАЖНО: Внутри main.js тоже нужно обновить пути импортов!
          # Это сложнее, поэтому лучше использовать относительные пути без версий,
          # а кэш сбрасывать только на главном файле (браузер подтянет остальное).
          
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Отправляем всё содержимое папки

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
