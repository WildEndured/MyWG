<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MyWG - War Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Размеры карты (сверху слева) -->
  <div class="hud-panel hud-top-left">
    <button class="hud-btn" data-size="100">100</button>
    <button class="hud-btn" data-size="500">500</button>
    <button class="hud-btn" data-size="1000">1000</button>
    <button class="hud-btn" id="fit">Fit</button>
  </div>

  <!-- Управление временем (сверху справа) -->
  <div class="hud-panel hud-top-right">
    <button class="hud-btn time-btn" id="btn-pause">II</button>
    <button class="hud-btn time-btn active" id="btn-speed-1">1x</button>
    <button class="hud-btn time-btn" id="btn-speed-2">2x</button>
    <button class="hud-btn time-btn" id="btn-speed-4">4x</button>
  </div>

  <!-- Управление позами (снизу) -->
  <div class="hud-panel hud-bottom">
    <button class="hud-btn stance-btn active" id="btn-stand">Стоя</button>
    <button class="hud-btn stance-btn" id="btn-run">Бег</button>
    <button class="hud-btn stance-btn" id="btn-crouch">Присяд</button>
    <button class="hud-btn stance-btn" id="btn-prone">Лёжа</button>
  </div>

  <div id="coords">X: 0, Y: 0</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
