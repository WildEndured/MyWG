<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MyWG - War Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Размеры карты (сверху слева) -->
  <div id="hud" class="top-hud">
    <button data-size="100" class="active">100</button>
    <button data-size="500">500</button>
    <button data-size="1000">1000</button>
    <button id="fit">Fit</button>
  </div>

  <!-- Управление временем (сверху справа) -->
  <div id="time-hud" class="top-hud-right">
    <button id="btn-pause" class="time-btn">II</button>
    <button id="btn-speed-1" class="time-btn active">1x</button>
    <button id="btn-speed-2" class="time-btn">2x</button>
    <button id="btn-speed-4" class="time-btn">4x</button>
  </div>

  <!-- Позы (снизу) -->
  <div id="stance-hud" class="bottom-hud">
    <button id="btn-stand">Стоя</button>
    <button id="btn-run">Бег</button>
    <button id="btn-crouch">Присяд</button>
    <button id="btn-prone">Лёжа</button>
  </div>

  <div id="coords">X: 0, Y: 0</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
